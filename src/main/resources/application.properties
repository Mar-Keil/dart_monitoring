# Local H2 database connection
spring.datasource.url=jdbc:h2:file:./data/dart_monitoring;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Create missing tables and update the schema during development
spring.jpa.hibernate.ddl-auto=update

# Preserve existing table and column names
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Show executed SQL in the terminal
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
